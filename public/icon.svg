<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with squircle/rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Camera Reticle Corners -->
  <path d="M 120 180 L 120 132 C 120 125 125 120 132 120 L 180 120" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
  <path d="M 332 120 L 380 120 C 387 120 392 125 392 132 L 392 180" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
  <path d="M 120 332 L 120 380 C 120 387 125 392 132 392 L 180 392" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
  <path d="M 332 392 L 380 392 C 387 392 392 387 392 380 L 392 332" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Mock Text Lines in Background -->
  <rect x="150" y="170" width="140" height="14" rx="7" fill="#64748b" opacity="0.5" />
  <rect x="306" y="170" width="60" height="14" rx="7" fill="#64748b" opacity="0.4" />
  
  <rect x="150" y="328" width="80" height="14" rx="7" fill="#64748b" opacity="0.4" />
  <rect x="246" y="328" width="116" height="14" rx="7" fill="#64748b" opacity="0.5" />

  <!-- Highlighted Target Box (Center OCR Match) -->
  <rect x="144" y="214" width="224" height="84" rx="16" fill="#10b981" fill-opacity="0.18" stroke="url(#emeraldGrad)" stroke-width="6" />
  
  <!-- Glowing Target Word Graphics -->
  <rect x="168" y="246" width="100" height="20" rx="10" fill="#34d399" />
  <rect x="282" y="246" width="62" height="20" rx="10" fill="#34d399" />

  <!-- Animated Scanner Laser Line (horizontal glow) -->
  <line x1="130" y1="256" x2="382" y2="256" stroke="#00f2fe" stroke-width="4" opacity="0.8" filter="url(#glow)" />

  <!-- Corner Crosshairs/HUD marks -->
  <circle cx="256" cy="140" r="4" fill="#38bdf8" opacity="0.7" />
  <circle cx="256" cy="372" r="4" fill="#38bdf8" opacity="0.7" />
</svg>
